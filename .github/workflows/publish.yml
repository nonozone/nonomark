name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - name: Publish workspace packages
        run: |
          for pkg in "@nonoim/editor-core" "@nonoim/editor-vue" "@nonoim/editor-react" "@nonoim/editor"; do
            echo "Publishing $pkg..."
            npm publish --workspace "$pkg" --access public --provenance || true
          done
