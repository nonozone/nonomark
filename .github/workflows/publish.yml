name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm publish --workspace @nonoim/editor-core --access public --provenance
      - run: npm publish --workspace @nonoim/editor-vue --access public --provenance
      - run: npm publish --workspace @nonoim/editor-react --access public --provenance
      - run: npm publish --workspace @nonoim/editor --access public --provenance
